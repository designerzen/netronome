<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netronome - Rock Solid Timing</title>
  <link rel="stylesheet" href="/index.css" />
</head>

<body>
  <button class="theme-toggle" id="theme-toggle">🌙 Dark</button>
  <main>
    <header class="header">
      <svg class="logo" width="100%" height="100%" viewBox="0 0 4267 4267" version="1.1"
        xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve"
        xmlns:serif="http://www.serif.com/"
        style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
        <g transform="matrix(4.84171,0,0,4.84171,-343.783,21.3232)">
          <path
            fill="currentColor"
            d="M496.436,776L104.603,776C104.603,776 498.908,91.454 500,92.406L499.793,323.733C503.643,323.545 507.517,323.45 511.413,323.45C515.566,323.45 519.693,323.558 523.793,323.771L524,92.837L918.636,776L526.804,776C521.784,776.321 516.721,776.483 511.62,776.483C506.519,776.483 501.456,776.321 496.436,776ZM499.62,323.844C384.942,330.082 293.743,425.172 293.743,541.395C293.743,661.645 391.371,759.272 511.62,759.272C631.869,759.272 729.497,661.645 729.497,541.395C729.497,425.172 638.298,330.082 523.62,323.844L523.62,514.583C534.172,519.207 541.54,529.745 541.54,542.004C541.54,558.533 528.151,571.919 511.625,571.919C495.098,571.919 481.7,558.533 481.7,542.004C481.7,529.748 489.07,519.212 499.62,514.586L499.62,323.844ZM523.62,56.862C523.62,63.489 518.246,68.863 511.619,68.863C504.994,68.863 499.62,63.489 499.62,56.862C499.62,50.236 504.994,44.863 511.619,44.863C518.246,44.863 523.62,50.236 523.62,56.862Z" />
        </g>
      </svg>

      <div class="header-text">
        <h1>Netronome</h1>
        <p class="subtitle">Rock solid JavaScript timing experiments</p>
      </div>
    </header>

    <!-- Shared Performance Chart (Top) -->
    <section class="panel">
      <h2 class="panel-title">Performance Monitor</h2>
      <div class="chart-container">
        <canvas id="multi-timer-chart"></canvas>
      </div>
    </section>

    <!-- Timer Creation Panel -->
    <section class="panel">
      <h2 class="panel-title">Create Timer</h2>
      <form class="timer-creation-form">
        <fieldset>
          <legend class="sr-only">Timer Settings</legend>
          <div class="timer-creation-row">
            <div class="form-group">
              <label for="new-timer-name">Timer Name</label>
              <input id="new-timer-name" type="text" placeholder="e.g., Kick Drum, Snare..." />
            </div>
          </div>

          <div class="timer-creation-row">
            <div class="form-group">
              <label for="new-timer-bpm">Tempo (BPM)</label>
              <input id="new-timer-bpm" type="number" value="120" min="20" max="300" />
            </div>

            <div class="form-group">
              <label for="new-timer-bpm-slider">BPM Slider</label>
              <input id="new-timer-bpm-slider" type="range" value="120" min="20" max="300" step="1" />
            </div>
          </div>

          <div class="timer-creation-row">
            <div class="form-group">
              <label for="new-timer-swing">Swing <span id="new-timer-swing-value">0%</span></label>
              <input id="new-timer-swing" type="range" value="0" min="0" max="1" step="0.01" />
            </div>
          </div>

          <div class="timer-creation-row">
            <div class="form-group">
              <label for="new-timer-worker">Worker Type</label>
              <select id="new-timer-worker">
                <option value="audio-context">Audio Context Worker</option>
                <option value="audio-worklet">Audio Worklet</option>
                <option value="elastic-audio-worklet">Elastic Audio Worklet (SharedArrayBuffer)</option>
                <option value="rolling">Rolling Worker</option>
                <option value="set-interval">SetInterval Worker</option>
                <option value="set-timeout">SetTimeout Worker</option>
              </select>
            </div>
          </div>

          <div class="timer-creation-row">
            <label for="new-timer-accurate">
              <input id="new-timer-accurate" type="checkbox" />
              Accurate Mode (drift compensation)
            </label>
            <label for="new-timer-tick-audio">
              <input id="new-timer-tick-audio" type="checkbox" />
              Tick Audio
            </label>
            <label for="new-timer-metronome">
              <input id="new-timer-metronome" type="checkbox" />
              Metronome Sound
            </label>
            <label for="new-timer-cpu-stress">
              <input id="new-timer-cpu-stress" type="checkbox" />
              CPU Stress Test
            </label>
            <label for="new-timer-midi">
              <input id="new-timer-midi" type="checkbox" />
              MIDI Transport Clock Connect
            </label>
          </div>

          <div class="button-group">
            <button id="create-timer" type="button">+ Create Timer</button>
          </div>
        </fieldset>
      </form>
    </section>

    <section class="panel">
      <h2 class="panel-title">WebRTC Sync</h2>
      <form class="timer-creation-form">
        <fieldset>
          <legend class="sr-only">WebRTC Sync Controls</legend>
          <div class="timer-creation-row sync-grid">
            <div class="form-group">
              <label for="sync-room-id">Room ID</label>
              <input id="sync-room-id" type="text" value="studio-a" />
            </div>
            <div class="form-group">
              <label for="sync-method">Pairing Method</label>
              <select id="sync-method">
                <option value="server">Signaling Server</option>
                <option value="qr" selected>QR / Bundle</option>
              </select>
            </div>
          </div>

          <div class="timer-creation-row sync-grid">
            <div class="form-group">
              <label for="sync-role">Role</label>
              <select id="sync-role">
                <option value="leader">Leader</option>
                <option value="follower">Follower</option>
              </select>
            </div>
            <div class="form-group">
              <label for="sync-timer-id">Timer To Sync</label>
              <select id="sync-timer-id"></select>
            </div>
          </div>

          <div class="timer-creation-row sync-grid" id="sync-server-controls">
            <div class="form-group">
              <label for="sync-server-url">Signaling Server URL</label>
              <input id="sync-server-url" type="url" value="http://localhost:8787" />
            </div>
          </div>

          <div class="button-group sync-button-group">
            <button id="sync-connect" type="button">Connect</button>
            <button id="sync-disconnect" type="button">Disconnect</button>
            <button id="sync-start" type="button">Start Synced</button>
            <button id="sync-push-tempo" type="button">Push Tempo</button>
          </div>

          <div id="sync-qr-controls" hidden>
            <div class="button-group sync-button-group">
              <button id="sync-generate-offer" type="button">Generate Offer QR</button>
              <button id="sync-apply-offer" type="button">Apply Offer Bundle</button>
              <button id="sync-generate-answer" type="button">Generate Answer QR</button>
              <button id="sync-apply-answer" type="button">Apply Answer Bundle</button>
            </div>

            <div class="button-group sync-button-group">
              <button id="sync-start-scan" type="button">Start Camera Scan</button>
              <button id="sync-stop-scan" type="button">Stop Camera Scan</button>
            </div>

            <div class="sync-camera-panel">
              <video id="sync-camera-preview" autoplay muted playsinline></video>
            </div>

            <div class="timer-creation-row sync-grid">
              <div class="form-group">
                <label for="sync-bundle-input">Paste Remote Bundle</label>
                <textarea id="sync-bundle-input" rows="8" spellcheck="false"></textarea>
              </div>
              <div class="form-group">
                <label for="sync-local-bundle">Local Bundle / QR Payload</label>
                <textarea id="sync-local-bundle" rows="8" readonly spellcheck="false"></textarea>
              </div>
            </div>

            <div class="timer-creation-row">
              <div class="form-group">
                <label for="sync-share-url">Share URL</label>
                <input id="sync-share-url" type="text" readonly spellcheck="false" />
              </div>
            </div>

            <div class="button-group sync-button-group">
              <button id="sync-copy-url" type="button">Copy Share URL</button>
            </div>

            <div class="sync-qr-display">
              <canvas id="sync-qr-canvas" width="256" height="256"></canvas>
            </div>
          </div>

          <div class="sync-status-panel">
            <div class="sync-health-strip" aria-label="Sync health">
              <span id="sync-health-scan" class="sync-health-pill" data-state="idle">Scan Idle</span>
              <span id="sync-health-peer" class="sync-health-pill" data-state="idle">Peer Offline</span>
              <span id="sync-health-lock" class="sync-health-pill" data-state="idle">Clock Free</span>
            </div>
            <p id="sync-status-text">Disconnected</p>
            <p id="sync-status-detail">Use QR / Bundle on GitHub Pages, or switch to a signaling server if you have one.</p>
          </div>
        </fieldset>
      </form>
    </section>

    <!-- Active Timers List -->
    <section class="panel">
      <h2 class="panel-title">Active Timers</h2>
      <div id="timers-list" class="timers-list"></div>
    </section>

    <!-- Multi-Timer Expanded Details -->
    <section id="timer-details-panel" class="timer-details-panel" hidden>
      <div class="timer-details-content"></div>
    </section>

    <!-- Templates -->
    <template id="timer-item-template">
      <article class="timer-item" data-timer-id="">
        <div class="timer-tick-feedback">
          <div class="timer-tick-indicator"></div>
          <div class="timer-tick-order"></div>
        </div>
        <div class="timer-color-indicator"></div>
        <div class="timer-item-info">
          <h3 class="timer-name"></h3>
          <p class="timer-status"></p>
          <span class="timer-type-badge"></span>
        </div>
        <div class="timer-item-controls">
          <button class="timer-toggle"></button>
          <button class="timer-remove">Remove</button>
        </div>
      </article>
    </template>
  </main>

  <script type="module" src="./tests/front-end.ts"></script>
</body>

</html>
