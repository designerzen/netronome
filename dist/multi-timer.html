<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/netronome/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netronome - Multi-Timer</title>
    <link rel="stylesheet" href="/netronome/index.css" />
  <script type="module" crossorigin src="/netronome/assets/multi-timer-32St9CLY.js"></script>
  <link rel="modulepreload" crossorigin href="/netronome/assets/multi-timer-chart-CbPqFL7e.js">
  <link rel="modulepreload" crossorigin href="/netronome/assets/timing.audioworklet-BvuKZwTC.js">
</head>

<body>
    <button class="theme-toggle" id="theme-toggle">🌙 Dark</button>
    <main>
        <header class="header">
            <svg class="logo" width="100%" height="100%" viewBox="0 0 4267 4267" version="1.1"
                xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve"
                xmlns:serif="http://www.serif.com/"
                style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
                <g transform="matrix(4.84171,0,0,4.84171,-343.783,21.3232)">
                    <path
                        fill="currentColor"
                        d="M496.436,776L104.603,776C104.603,776 498.908,91.454 500,92.406L499.793,323.733C503.643,323.545 507.517,323.45 511.413,323.45C515.566,323.45 519.693,323.558 523.793,323.771L524,92.837L918.636,776L526.804,776C521.784,776.321 516.721,776.483 511.62,776.483C506.519,776.483 501.456,776.321 496.436,776ZM499.62,323.844C384.942,330.082 293.743,425.172 293.743,541.395C293.743,661.645 391.371,759.272 511.62,759.272C631.869,759.272 729.497,661.645 729.497,541.395C729.497,425.172 638.298,330.082 523.62,323.844L523.62,514.583C534.172,519.207 541.54,529.745 541.54,542.004C541.54,558.533 528.151,571.919 511.625,571.919C495.098,571.919 481.7,558.533 481.7,542.004C481.7,529.748 489.07,519.212 499.62,514.586L499.62,323.844ZM523.62,56.862C523.62,63.489 518.246,68.863 511.619,68.863C504.994,68.863 499.62,63.489 499.62,56.862C499.62,50.236 504.994,44.863 511.619,44.863C518.246,44.863 523.62,50.236 523.62,56.862Z" />
                </g>
            </svg>

            <div class="header-text">
                <h1>Netronome - Multi-Timer</h1>
                <p class="subtitle">Run multiple timers at different tempos and compare performance</p>
            </div>
        </header>

        <!-- Global Controls -->
        <section class="panel">
            <h2 class="panel-title">Global Controls</h2>
            <div class="button-group">
                <button id="start-all">Start All</button>
                <button id="stop-all" disabled>Stop All</button>
                <button id="reset-all">Reset All</button>
            </div>
            <label for="global-tick-audio" class="global-option-label">
                <input id="global-tick-audio" type="checkbox" />
                Enable Tick Audio for all timers
            </label>
        </section>

        <!-- Add Timer Button -->
        <button class="add-timer-btn" id="add-timer">+ Add Timer</button>

        <!-- Timers Container -->
        <div class="multi-timer-container" id="timers-container">
            <!-- Timer cards will be inserted here -->
        </div>

        <!-- Performance Chart -->
        <section class="panel">
            <h2 class="panel-title">Performance Comparison</h2>
            <div class="chart-container">
                <canvas id="multi-timer-chart"></canvas>
            </div>
        </section>

        <!-- Statistics Table -->
        <section class="panel">
            <h2 class="panel-title">Timer Statistics</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Timer</th>
                            <th>Status</th>
                            <th>BPM</th>
                            <th>Avg Lag (ms)</th>
                            <th>Avg Drift (ms)</th>
                            <th>Ticks</th>
                        </tr>
                    </thead>
                    <tbody id="stats-table">
                        <tr class="empty-state">
                            <td colspan="6">Add timers to begin comparison</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Templates -->
    <template id="timer-card-template">
        <article class="timer-card">
            <div class="timer-tick-indicator"></div>
            <header class="timer-card-header">
                <div class="timer-color-indicator"></div>
                <div class="timer-card-header-content">
                    <h3 class="timer-card-title"></h3>
                    <span class="timer-type-badge"></span>
                </div>
            </header>

            <div class="timer-controls-row">
                <div class="timer-control-group">
                    <label>Tempo (BPM)</label>
                    <input type="number" class="timer-bpm" min="20" max="300" />
                </div>
                <div class="timer-control-group">
                    <label>Worker Type</label>
                    <select class="timer-worker-type">
                        <option value="audiocontext">AudioContext</option>
                        <option value="audioworklet">AudioWorklet</option>
                        <option value="rolling">Rolling</option>
                        <option value="setinterval">SetInterval</option>
                        <option value="settimeout">SetTimeout</option>
                    </select>
                </div>
            </div>

            <div class="timer-stats">
                <div class="timer-stat">
                    <div class="timer-stat-label">Avg Lag</div>
                    <div class="timer-stat-value">0.00ms</div>
                </div>
                <div class="timer-stat">
                    <div class="timer-stat-label">Avg Drift</div>
                    <div class="timer-stat-value">0.00ms</div>
                </div>
                <div class="timer-stat">
                    <div class="timer-stat-label">Ticks</div>
                    <div class="timer-stat-value">0</div>
                </div>
                <div class="timer-stat">
                    <div class="timer-stat-label">Status</div>
                    <div class="timer-stat-value">⏸ Stopped</div>
                </div>
            </div>

            <div class="timer-actions">
                <button class="timer-start">Start</button>
                <button class="timer-stop" disabled>Stop</button>
                <button class="timer-clear" disabled>Clear</button>
                <button class="timer-remove remove">Remove</button>
            </div>
        </article>
    </template>

</body>

</html>
